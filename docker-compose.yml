version: '3.8'

services:
  nginx:
    image: nginx:alpine
    ports:
      - "8000:8000"
      - "3000:3000"
      - "3001:3001"
    volumes:
      - ./docker/nginx/conf.d:/etc/nginx/conf.d
      - ./backend-api:/var/www/backend
    depends_on:
      - php
      - student-web
      - admin-web
    networks:
      - upn_network

  php:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    volumes:
      - ./backend-api:/var/www/backend
    networks:
      - upn_network

  mysql:
    image: mysql:8.0
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: student_hub
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: upn_user
      MYSQL_PASSWORD: secretpassword
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - upn_network

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    networks:
      - upn_network

  student-web:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./student-web:/app
    command: npm run dev
    expose:
      - "3000"
    networks:
      - upn_network
    environment:
      - NODE_ENV=development

  admin-web:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./admin-web:/app
    command: npm run dev
    expose:
      - "3001"
    networks:
      - upn_network
    environment:
      - NODE_ENV=development
      - PORT=3001

networks:
  upn_network:
    driver: bridge

volumes:
  mysql_data:
